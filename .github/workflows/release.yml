name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

env:
  XRAY_VERSION: "v0.0.14-test"
  HEV_VERSION: "2.14.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            hev_binary: hev-socks5-tunnel-linux-x86_64
            hev_sidecar_name: hev-socks5-tunnel-x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            hev_binary: hev-socks5-tunnel-linux-arm64
            hev_sidecar_name: hev-socks5-tunnel-aarch64-unknown-linux-gnu
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            hev_binary: ""
            hev_sidecar_name: ""
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            hev_binary: hev-socks5-tunnel-darwin-arm64
            hev_sidecar_name: hev-socks5-tunnel-aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # Linux-specific system dependencies
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Download xray-core sidecar from our fork (bundles wintun.dll on Windows).
      - name: Download xray-core binary
        shell: bash
        run: ./scripts/download-xray.sh "${XRAY_VERSION}"

      # Download hev-socks5-tunnel sidecar binary (Linux and macOS only)
      - name: Download hev-socks5-tunnel binary
        if: matrix.hev_binary != ''
        shell: bash
        run: |
          curl -sL "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/${{ matrix.hev_binary }}" \
            -o "src-tauri/binaries/${{ matrix.hev_sidecar_name }}"
          chmod +x "src-tauri/binaries/${{ matrix.hev_sidecar_name }}"

      # Create empty hev-socks5-tunnel placeholder for Windows (not used but required by Tauri sidecar config)
      - name: Create hev-socks5-tunnel placeholder (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          touch "src-tauri/binaries/hev-socks5-tunnel-x86_64-pc-windows-msvc.exe"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }}

      # Collect artifacts with platform-specific names
      - name: Collect Linux artifacts
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb release-assets/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm release-assets/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage release-assets/ 2>/dev/null || true

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi release-assets/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe release-assets/ 2>/dev/null || true

      - name: Collect macOS artifacts
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg release-assets/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz release-assets/ 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rust_target }}
          path: release-assets/*
          if-no-files-found: warn

  upload-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "Uploading artifacts to release ${TAG}..."
          for dir in artifacts/release-*/; do
            for file in "${dir}"*; do
              if [ -f "$file" ]; then
                echo "  Uploading: $(basename "$file")"
                gh release upload "${TAG}" "$file" --clobber
              fi
            done
          done
          echo "Done."
