name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            sidecar_ext: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            sidecar_ext: ""

    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tauri's build script requires the externalBin sidecars to exist on disk
      # even for `cargo check`. Empty placeholders are enough — we don't run them.
      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/xray-${{ matrix.rust_target }}${{ matrix.sidecar_ext }}"
          touch "src-tauri/binaries/hev-socks5-tunnel-${{ matrix.rust_target }}${{ matrix.sidecar_ext }}"

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.rust_target }}

      - name: pnpm check
        run: pnpm check
