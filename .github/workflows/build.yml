name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            sidecar_ext: ""
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            sidecar_ext: ""
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            sidecar_ext: ""

    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux GUI deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Tauri's build script requires the externalBin sidecars to exist on disk
      # even for `cargo check`. Empty placeholders are enough — we don't run them.
      - name: Stub sidecar binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/xray-${{ matrix.rust_target }}${{ matrix.sidecar_ext }}"
          touch "src-tauri/binaries/hev-socks5-tunnel-${{ matrix.rust_target }}${{ matrix.sidecar_ext }}"
          # tauri.windows.conf.json declares wintun.dll as a Windows-only bundle
          # resource; tauri-build validates that path during cargo check too.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            touch "src-tauri/binaries/wintun.dll"
          fi

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.rust_target }}

      - name: pnpm check
        run: pnpm check

  bundle:
    name: bundle (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            hev_binary: hev-socks5-tunnel-linux-x86_64
            hev_sidecar_name: hev-socks5-tunnel-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            hev_binary: hev-socks5-tunnel-linux-arm64
            hev_sidecar_name: hev-socks5-tunnel-aarch64-unknown-linux-gnu
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            hev_binary: ""
            hev_sidecar_name: ""
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            hev_binary: hev-socks5-tunnel-darwin-arm64
            hev_sidecar_name: hev-socks5-tunnel-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    env:
      # Bumpable; matches release.yml. Our Xray-core fork release with the
      # wintun.dll bundle for Windows and the standard sidecar binaries.
      XRAY_VERSION: v0.0.14-test
      HEV_VERSION: 2.14.4

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: bundle-${{ matrix.rust_target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux GUI deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Real xray-core sidecar (and wintun.dll on Windows) from our fork.
      - name: Download xray-core
        shell: bash
        run: ./scripts/download-xray.sh "${XRAY_VERSION}"

      - name: Download hev-socks5-tunnel sidecar
        if: matrix.hev_binary != ''
        shell: bash
        run: |
          curl -fsSL "https://github.com/heiher/hev-socks5-tunnel/releases/download/${HEV_VERSION}/${{ matrix.hev_binary }}" \
            -o "src-tauri/binaries/${{ matrix.hev_sidecar_name }}"
          chmod +x "src-tauri/binaries/${{ matrix.hev_sidecar_name }}"

      # Tauri sidecar config still references this triple on Windows; an empty
      # placeholder keeps tauri-build happy even though TUN-on-Windows is now
      # provided by xray's l3client wintun backend, not hev.
      - name: Placeholder hev sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: touch "src-tauri/binaries/hev-socks5-tunnel-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }}

      - name: Collect Linux bundles
        if: startsWith(matrix.os, 'ubuntu-')
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb       ci-artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm       ci-artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage ci-artifacts/ 2>/dev/null || true

      - name: Collect Windows bundles
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi   ci-artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe  ci-artifacts/ 2>/dev/null || true

      - name: Collect macOS bundles
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg          ci-artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app.tar.gz ci-artifacts/ 2>/dev/null || true

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: v2rayV-${{ matrix.rust_target }}
          path: ci-artifacts/*
          if-no-files-found: warn
          retention-days: 14
