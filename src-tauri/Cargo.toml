[package]
name = "v2rayv"
version = "1.0.0"
description = "VLESS+REALITY desktop client"
authors = ["sevaktigranyan305-netizen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "v2rayv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux uses the Secret Service D-Bus protocol (provided by
# gnome-keyring, kwallet, keepassxc, etc.) to persist the sudo
# password — same role as macOS Keychain. The blocking sync
# backend avoids dragging tokio into the rest of the codebase.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
